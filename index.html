<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cash Run</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jost:wght@400;700;900&display=swap');
        
        /* RESET & FULL SCREEN SETUP */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #161b22;
            font-family: 'Jost', sans-serif;
            user-select: none;
        }

        .game-container {
            width: 100%;
            height: 100%;
            background-color: #161b22;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER */
        .header {
            width: 100%;
            padding: 15px 20px;
            padding-top: max(25px, env(safe-area-inset-top));
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            background-color: #1f242d;
            border-bottom: 4px solid rgba(0,0,0,0.2);
            z-index: 10;
            flex-shrink: 0;
        }

        .score-box { 
            font-size: 1.4rem; 
            font-weight: 900; 
            text-shadow: 0 2px 0 rgba(0,0,0,0.3);
        }

        /* GAME AREA */
        .game-area {
            position: relative;
            width: 100%;
            flex-grow: 1;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* NOTIFICATIONS */
        #levelUpNotification {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 3.5rem;
            font-weight: 900;
            color: #ffd700;
            text-align: center;
            text-shadow: 0 4px 0 #000, 0 0 20px rgba(255, 215, 0, 0.8);
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            width: 100%;
        }

        .animate-level-text { animation: levelPop 2s ease-out forwards; }
        @keyframes levelPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            40% { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
            100% { opacity: 0; transform: translate(-50%, -150%) scale(1.0); }
        }

        /* TAP OVERLAY */
        #tapToPlayOverlay {
            position: absolute;
            top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 15;
            display: none; 
            width: 100%;
        }
        .tap-text {
            font-size: 2.5rem;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulseText 1.5s infinite;
            text-shadow: 0 4px 0 #000;
        }
        .hand-icon {
            font-size: 4rem;
            margin-top: 10px;
            animation: bounce 1.5s infinite;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5));
        }
        @keyframes pulseText {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* --- GAMIFIED BUTTONS & MODALS --- */
        .modal {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            justify-content: center; 
            align-items: center;
            background-color: rgba(0, 0, 0, 0.85); /* Default dark backdrop */
            z-index: 30;
            backdrop-filter: blur(8px);
            overflow: hidden; 
        }
        
        /* OVERRIDE for AD TIMER: Must be transparent/paused background */
        #adTimerModal {
            /* Keep background very dim to show paused game, but no blur */
            background-color: rgba(0, 0, 0, 0.5); 
            backdrop-filter: none;
        }
        
        .modal-content {
            padding: 30px;
            border-radius: 2rem;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            width: 85%;
            max-width: 340px;
            border: 4px solid transparent; 
            transform: scale(0.9);
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
            background: #1f242d;
            position: relative; 
            z-index: 32; 
        }
        
        /* Ad Timer Modal Content: Make it purely functional/transparent */
        #adTimerModal .modal-content { 
            padding: 0;
            background: transparent;
            box-shadow: none;
            /* CRITICAL FIX: Remove size constraints and make it wrap tightly */
            width: auto;
            max-width: none;
            display: contents; 
        }

        @keyframes modalPop { to { transform: scale(1); } }

        /* --- Ray Effect CSS (Only applies to Game Over / Level Up) --- */
        .modal-ray-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            /* --- CRITICAL FIX: Use vmax to guarantee covering the diagonal of the viewport --- */
            width: 360vmax; 
            height: 360vmax;
            transform: translate(-50%, -50%);
            z-index: 31; 
            opacity: 0.95;
            pointer-events: none; 
            background: 
                repeating-conic-gradient(
                    from 0deg, 
                    rgba(255, 255, 255, 0.1) 0%, 
                    rgba(255, 255, 255, 0.05) 5%, 
                    transparent 10%
                );
            animation: rotateRays 15s linear infinite;
        }

        #gameOverModal .modal-ray-bg {
            background: 
                repeating-conic-gradient(
                    from 0deg, 
                    rgba(255, 0, 0, 0.1) 0%, 
                    rgba(255, 100, 100, 0.05) 5%, 
                    transparent 10%
                );
            animation-duration: 10s;
        }

        #levelUpModal .modal-ray-bg {
            background: 
                repeating-conic-gradient(
                    from 0deg, 
                    rgba(0, 255, 0, 0.1) 0%, 
                    rgba(100, 255, 100, 0.05) 5%, 
                    transparent 10%
                );
            animation-duration: 8s;
        }

        @keyframes rotateRays {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        /* --- End of Ray Effect CSS --- */


        .modal-title { 
            font-size: 2.5rem; 
            font-weight: 900; 
            margin-bottom: 5px; 
            text-shadow: 0 3px 0 rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }
        .modal-subtitle { 
            font-size: 1.1rem; 
            opacity: 0.9; 
            margin-bottom: 25px; 
            font-weight: 600;
        }

        .score-card {
            background: rgba(0,0,0,0.2);
            border-radius: 1rem;
            padding: 15px;
            margin-bottom: 25px;
            border: 2px solid rgba(255,255,255,0.05);
        }

        /* 3D BUTTON STYLES */
        .gamified-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            font-family: 'Jost', sans-serif;
            font-size: 1.3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: white;
            border: none;
            border-radius: 1rem;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            /* 3D Effect */
            border-bottom: 6px solid rgba(0,0,0,0.2); 
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .gamified-btn:active {
            transform: translateY(4px); /* Push down effect */
            border-bottom: 2px solid rgba(0,0,0,0.2);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        /* Revive Button - Primary CTA */
        .btn-revive {
            background: linear-gradient(to bottom, #3b82f6, #2563eb);
            border-bottom-color: #1d4ed8;
            margin-bottom: 15px;
        }

        /* Start New Game Button - Yellow/Orange */
        .btn-new-game {
            background: linear-gradient(to bottom, #ffc107, #ff9800); 
            border-bottom-color: #ff8f00; 
            font-size: 1.1rem;
            padding: 14px;
        }
        
        /* Next Level Button */
        .btn-next {
            background: linear-gradient(to bottom, #22c55e, #16a34a);
            border-bottom-color: #15803d;
        }

        /* Icon Styling */
        .btn-icon-img {
            width: 75px;
            height: 75px;
            filter: drop-shadow(0 0 2px rgba(0,0,0,0.5));
        }

        /* Pulse animation for Revive button */
        .pulse-btn { animation: btnPulse 2s infinite; }
        @keyframes btnPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .pulse-btn:active { animation: none; transform: translateY(4px); }
        
        /* --- Ad Timer Button Styles --- */
        
        .revive-timer-container {
            position: relative;
            width: 140px; 
            height: 140px;
            /* Center the container slightly higher, but now relative to its new wrapper */
            margin: 0 auto; 
            transform: translateY(0); 
        }
        
        .revive-timer-ring {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.3); 
        }

        .revive-timer-progress {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #22c55e 0%, 
                #16a34a 0% 
            );
            transition: background 0.3s linear;
        }

        .revive-timer-button {
            position: absolute;
            top: 10px; left: 10px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #10b981, #059669); /* Emerald green */
            color: white;
            font-weight: 900; 
            font-size: 1.1rem; 
            text-transform: uppercase;
            border: none;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1;
            padding: 0;
            line-height: 1.2;
        }
        
        .revive-timer-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.3);
        }

        .timer-icon {
            /* Styles for the image icon */
            width: 50px; 
            height: 50px;
            margin-bottom: 3px;
        }
        
        .timer-text {
             font-size: 1rem;
        }

        .timer-countdown {
            display: none; 
        }
        
        .timer-message {
            display: none; 
        }

    </style>
</head>
<body>

<div class="game-container">
    <div id="levelUpNotification">LEVEL UP!</div>

    <div class="header">
        <div class="w-full flex justify-between items-center">
            <h1 class="text-xl font-bold italic">CASH RUN</h1>
            <div class="flex items-center space-x-4">
                <div class="score-box">Lvl <span id="levelDisplay">1</span></div>
                <div class="score-box">$<span id="scoreDisplay">0</span></div>
            </div>
        </div>
        <div id="levelProgressContainer" class="w-full bg-gray-700 rounded-full h-2.5 overflow-hidden absolute bottom-0 left-0">
            <div id="levelProgressBar" class="bg-green-500 h-2.5 rounded-full transition-all duration-300 ease-linear" style="width: 0%"></div>
        </div>
    </div>

    <div class="game-area">
        <canvas id="gameCanvas"></canvas>
        
        <div id="tapToPlayOverlay">
            <div class="tap-text">TAP TO PLAY</div>
            <div class="hand-icon">👆</div>
        </div>
    </div>

    <div id="adTimerModal" class="modal">
        <div class="modal-content">
            <div class="revive-timer-container">
                <div class="revive-timer-ring"></div>
                <div id="timerProgress" class="revive-timer-progress"></div>
                <button id="adTimerButton" class="revive-timer-button">
                    <img src="/play_btn.png" alt="Play Video" class="timer-icon">
                    <span class="timer-text">CONTINUE</span>
                </button>
                <div id="timerCountdownDisplay" class="timer-countdown">10</div>
            </div>
        </div>
    </div>

    <div id="gameOverModal" class="modal">
        <div class="modal-ray-bg"></div>
        <div class="modal-content">
            <div class="modal-title" id="gameOverTitle">BUSTED!</div>
            <div class="modal-subtitle">Ran out of funds 💸</div>
            
            <div class="score-card">
                <div class="text-sm opacity-75 mb-1">FINAL NET WORTH</div>
                <div class="score-val text-3xl">$<span id="modalTotalNetWorth">0</span></div>
            </div>
            
            <button id="newGameButton" class="gamified-btn btn-new-game">
                START NEW RUN
            </button>
        </div>
    </div>

    <div id="levelUpModal" class="modal">
        <div class="modal-ray-bg"></div>
        <div class="modal-content">
            <div class="modal-title" id="levelUpTitle">AWESOME!</div>
            <div class="modal-subtitle">Level Completed 🚀</div>

            <div class="score-card">
                <div class="flex justify-between items-center mb-2">
                    <span class="opacity-75 text-sm">Level Earnings</span>
                    <span class="font-bold text-xl text-green-400">+$<span id="levelUpRunScore">0</span></span>
                </div>
                <div class="border-t border-white/10 my-2"></div>
                <div class="text-sm opacity-75 mb-1">TOTAL NET WORTH</div>
                <div class="text-4xl font-black">$<span id="levelUpTotalNetWorth">0</span></div>
            </div>
            
            <button id="nextLevelButton" class="gamified-btn btn-next">
                NEXT LEVEL <span>➡️</span>
            </button>
        </div>
    </div>
</div>

<script type="module" src="/script.js"></script>
</body>
</html>
